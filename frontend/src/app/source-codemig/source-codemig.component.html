<div>
    <div class="title">新建任务</div>
    <form [formGroup]="uploadForm" (ngSubmit)="submit()">
        <div class="task_block">
            <div class="name">
                <span style="color: red; line-height: 40px;">*</span>任务名称
            </div>
            <div class="content">
                <input type="text" id="taskName" name="taskName"
                   formControlName="taskName"
                   class="form-control"
                   placeholder="请输入任务名称...">
            </div>
        </div>

        <div class="task_block">
            <div class="name">上传文件夹/压缩包</div>
            <div class="content">
                <button type="button" class="plx-btn" (click)="folderInput.click()">选择文件夹</button>
                <input #folderInput type="file" webkitdirectory (change)="onFolderSelect($event)" hidden>

                <button type="button" class="plx-btn" (click)="ZipInput.click()">选择压缩包</button>
                <input #ZipInput type="file" accept=".zip,.tar.bz,.tar.bz2,.tar.xz,.tbz,.tbz2,.tgz,.tar.gz,.tar,.txz"  (change)="onZipSelect($event)" hidden>

                <label style="font-size: 12px; color: gray; margin-left: 10px;">
                    <span>注：不扫描.git和.github文件</span>
                </label>
            </div>
        </div>

        <!-- 文件总大小超限提示 -->
        <div *ngIf="total_size_exceed" class="alert alert-error total-size-exceed">
            <div class="alert-content">
                <span class="alert-icon">⚠️</span>
                <span class="alert-message">文件或压缩包大小超过2GB上限，请减少文件后重试。</span>
            </div>
        </div>

        <div *ngIf="upload_file_info_lists.length > 0" class="upload_lists">
            <ul class="folder-list">
                <li *ngFor="let uploadedFolder of uploadedFolders" class="folder-item">
                  <span class="folder-name">📁 {{ getKey(uploadedFolder) }}</span>
                  <button type="button" class="delete-btn" (click)="deleteFolder(uploadedFolder)">✖</button>
                </li>
            </ul>
        </div>

        <div style="margin-left: 215px; margin-top: 10px;" *ngIf="is_uploading_folder">
            <div class="detail-label">文件夹上传中...</div>
            <div class="loading-bar"></div>
        </div>

        <div style="margin-left: 215px; margin-top: 10px;" *ngIf="is_uploading_zip">
            <div class="detail-label">压缩包上传中...</div>
            <plx-progressbar
              [percentage]="fileUploadProgressPercentage"
              [type]="'page'"
              [bartype]="'info'"
              [size]="'sm'"
              [width]="'400px'">
            </plx-progressbar>
        </div>

        <div *ngIf="enable" class="task_block">
            <div class="name">是否扫描依赖库</div>
            <div class="content">
                <label style="font-size: 13px;">
                    <input
                      type="radio"
                      class="plx-radio"
                      formControlName="scanDependencies"
                      name="scanDependencies"
                      value="yes"
                      [checked]="uploadForm.get('scanDependencies')?.value === 'yes'"
                    >
                    <div class="radio-substitute"></div>
                    <span>是</span>
                </label>
                <label style="font-size: 13px; margin-left: 20px;">
                    <input
                      type="radio"
                      class="plx-radio"
                      formControlName="scanDependencies"
                      name="scanDependencies"
                      value="no"
                      [checked]="uploadForm.get('scanDependencies')?.value === 'no'"
                    >
                    <div class="radio-substitute"></div>
                    <span>否</span>
                </label>
                <label style="font-size: 12px; margin-left: 20px; color: gray;">
                    <span>注：只支持python/go语言依赖扫描</span>
                </label>
            </div>
        </div>
        <div *ngIf="uploadForm.value.scanDependencies == 'yes'" class="task_block">
            <div class="name">python/go依赖扫描</div>
            <div class="content">
                <label style="font-size: 13px;">
                    <input
                      type="radio"
                      class="plx-radio"
                      formControlName="dependencies"
                      name="dependencies"
                      value="python"
                      [checked]="uploadForm.get('dependencies')?.value === 'python'"
                    >
                    <div class="radio-substitute"></div>
                    <span>python</span>
                </label>

                  <label style="font-size: 13px; margin-left: 20px;">
                    <input
                      type="radio"
                      class="plx-radio"
                      formControlName="dependencies"
                      name="dependencies"
                      value="go"
                      [checked]="uploadForm.get('dependencies')?.value === 'go'"
                    >
                    <div class="radio-substitute"></div>
                    <span>go</span>
                </label>
            </div>
        </div>
         <!-- Python 语言配置区块 -->
        <div *ngIf="uploadForm.value.scanDependencies == 'yes' && uploadForm.value.dependencies == 'python'" class="task_block">
            <div class="name"><span style="color: red; line-height: 40px;">*</span>python解释器地址</div>
            <div class="content">
                <input type="text" id="pythonInterpreter" name="pythonInterpreter"
                   formControlName="pythonInterpreter"
                   class="form-control"
                   placeholder="例如：/usr/bin/python3">
            </div>
            <button type="button" class="plx-ico-help-tip-20" [plxTooltip]="python_interpreter_tip" (click)="copyContent('/usr/bin/python3')"></button>
        </div>
        <div *ngIf="uploadForm.value.scanDependencies == 'yes' && uploadForm.value.dependencies == 'python'" class="task_block">
            <div class="name">python镜像源地址</div>
            <div class="content">
                <input type="text" id="pythonImageSource" name="pythonImageSource"
                   formControlName="pythonImageSource"
                   class="form-control"
                   placeholder="例如：https://mirrors.aliyun.com/pypi/simple/">
            </div>
            <button type="button" class="plx-ico-help-tip-20" [plxTooltip]="python_image_source_tip" (click)="copyContent('https://mirrors.aliyun.com/pypi/simple/')"></button>
        </div>
        <!-- Go 语言配置区块 -->
        <div *ngIf="uploadForm.value.scanDependencies == 'yes' && uploadForm.value.dependencies == 'go'" class="task_block">
            <div class="name"><span style="color: red; line-height: 40px;">*</span>Go安装路径</div>
            <div class="content">
                <input type="text"
                    formControlName="goInstallPath"
                    class="form-control"
                    placeholder="例如：/usr/local/go ">
            </div>
            <button type="button" class="plx-ico-help-tip-20" [plxTooltip]="go_install_path_tip" (click)="copyContent('/usr/local/go')"></button>
        </div>

        <div *ngIf="uploadForm.value.scanDependencies == 'yes' && uploadForm.value.dependencies == 'go'" class="task_block">
            <div class="name">Go环境变量设置</div>
            <div class="content">
                <textarea
                    formControlName="goEnvironment"
                    class="form-textarea"
                    placeholder="例如：GOPROXY=https://proxy.internal.com,https://goproxy.cn,direct | GOPRIVATE=git.internal.com | GONOPROXY=git.internal.com | GOSUMDB=sum.golang.google.cn | GONOSUMDB=*.corp.com | GOINSECURE=*.internal.com | SSL_CERT_FILE=/path/to/custom-ca.pem">
                </textarea>
            </div>
            <button type="button" class="plx-ico-help-tip-20" [plxTooltip]="go_environment_tip" (click)="copyContent(go_environment_content)"></button>
        </div>

        <div class="task_block">
            <div class="name"></div>
            <div class="content">
                <button type="submit" class="plx-btn plx-btn-primary">提交任务</button>
            </div>
        </div>


    </form>
</div>
<ng-template #textLoadingTemp>
    <plx-loading [type]="'max'" [showInfo]="true" [info]="'正在处理中...'" [delay]="0" [percent]="loadingPercent"></plx-loading>
</ng-template>
