<div style="height: calc(100vh - 90px); overflow: auto; padding: 20px;">
  <!-- 标题 -->
  <div class="page-header" style="margin-bottom: 20px;">
  </div>
  
  <!-- 新增按钮区域 -->
  <div class="button-container" style="margin-bottom: 20px; position: relative; min-height: 40px;">
    <button class="plx-btn plx-btn-primary add-button"
            (click)="createApiKey()"
            style="position: absolute; left: 5px; top: 0;">
      <span class="plx-ico-add-16"></span> 新增API Key
    </button>
    <div style="clear: both;"></div>
  </div>
  
  <!-- 分隔线 -->
  <div class="divider" style="margin-bottom: 20px;"></div>
  
  <!-- 加载状态 -->
  <div *ngIf="isLoading" style="text-align: center; padding: 50px;">
    <div class="plx-spinner"></div>
    <p style="margin-top: 10px;">加载中...</p>
  </div>
  
  <!-- 数据为空状态 -->
  <div *ngIf="!isLoading && data.length === 0" style="text-align: center; padding: 50px;">
    <p style="color: #999; font-size: 16px;">暂无API Key数据</p>
    <button class="plx-btn plx-btn-primary" (click)="createApiKey()" style="margin-top: 20px;">
      创建第一个API Key
    </button>
  </div>
  
  <!-- API Key列表表格 -->
  <div *ngIf="!isLoading && data.length > 0" class="table-scroll-wrapper">
    <plx-table [data]="data"
               [columns]="columns"
               [tableType]="'large'"
               [showCheckBox]="true"
               [checkModel]=" 'single' "
               [showColFilterToggle]="false"
               [showCustomCol]="false"
               [isPrepareDataOnLocal]="true"
               [showGlobalFilter]="false"
               [showPagination]="true"
               [pageSize]="10"
               [checkboxCallback]="checkboxCallback.bind(this)"
               [isRelatedCheckboxOnRowClick]="true"
               [scroll]="{ x: '100%', y: calcTableHeight(), keepHeight: false }">
    </plx-table>
  </div>
  
  <!-- 底部操作按钮 -->
  <div *ngIf="!isLoading && data.length > 0" class="action-buttons" style="margin-top: 20px; text-align: center;">
    <button class="plx-btn plx-btn-danger" 
            (click)="deleteApiKey()"
            style="margin-right: 20px;">
      <span class="plx-ico-delete-16"></span> 删除选中
    </button>
    <button class="plx-btn plx-btn-primary"
            (click)="setDefaultApikey()"
            style="margin-right: 20px;">
      <span class="plx-ico-check-16"></span> 设为默认
    </button>
    <button class="plx-btn plx-btn-primary"
            (click)="setModelDefaultApikey()">
      <span class="plx-ico-check-16"></span> 模型选择
    </button>
  </div>
  
<!-- 新建API Key弹窗 -->
<ng-template #create_content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">新增API Key</h4>
    <button type="button" class="close" (click)="d('Cross click')">
      <span class="plx-ico-close-16"></span>
    </button>
  </div>
  <div class="modal-body">
    <!-- API格式选择器 -->
    <div class="api-format-selector" style="margin-bottom: 16px; padding: 0 16px;">
      <div style="display: flex; gap: 20px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input 
            type="radio" 
            name="apiFormat" 
            [value]="'openai'" 
            [(ngModel)]="selectedApiFormat"
            [disabled]="apikeyTesting"
            [disabled]="apikeyCorrect"
            (change)="onApiFormatChange()">
          <span>OpenAI 格式</span>
        </label>
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input 
            type="radio" 
            name="apiFormat" 
            [value]="'cursor'" 
            [(ngModel)]="selectedApiFormat"
            [disabled]="apikeyTesting"
            [disabled]="apikeyCorrect"
            (change)="onApiFormatChange()">
          <span>Cursor 格式</span>
        </label>
      </div>
    </div>

    <!-- 统一的表单 -->
    <plx-form 
      *ngIf="showForm"
      [settings]="create_formSetting">
    </plx-form>
  </div>
  <div class="modal-footer">
    <div class="form-group" style="display: flex; justify-content: space-between; width: 100%;">
      <!-- 左侧按钮组：测试按钮 -->
      <div class="btnGroup modal-btn" style="margin-top: -16px;">
        <button 
          type="button" 
          class="plx-btn" 
          [class.plx-btn-disabled]="apikeyTesting"
          [disabled]="apikeyTesting"
          (click)="api_key_test()"
          style="min-width: 140px;">
          测试API Key
        </button>
      </div>
      <span *ngIf="apikeyTesting" style="color: #42b832; font-size: 14px; margin-top: -16px; white-space: nowrap;">
        测试中。。。
      </span>
      <!-- 右侧按钮组：确定和取消 -->
      <div class="btnGroup modal-btn" style="margin-top: -16px; display: flex; gap: 8px;">
        <button 
          type="button" 
          class="plx-btn plx-btn-primary" 
          [class.plx-btn-disabled]="!apikeyCorrect"
          [disabled]="!apikeyCorrect"
          (click)="create_submit()">
          确定
        </button>
        <button 
          type="button" 
          class="plx-btn" 
          (click)="create_cancel()">
          取消
        </button>
      </div>
    </div>
  </div>
</ng-template>
  
  <!-- 删除确认弹窗 -->
  <ng-template #delete_content let-c="close" let-d="dismiss">
    <div class="modal-header">
      <h4 class="modal-title">删除确认</h4>
      <button type="button" class="close" (click)="d('Cross click')">
        <span class="plx-ico-close-16"></span>
      </button>
    </div>
    <div class="modal-body">
      <div style="text-align: center; padding: 20px;">
        <p style="font-size: 16px; margin-bottom: 20px;">
          确定要删除以下API Key吗？
        </p>
        <div style="background-color: #f5f5f5; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
          <p><strong>ID:</strong> {{ selectedRow?.api_key_id || '-' }}</p>
          <p><strong>API Key:</strong> {{ getDisplayApiKey(selectedRow?.api_key || '') }}</p>
          <p><strong>Base URL:</strong> {{ selectedRow?.base_url || '未设置' }}</p>
          <p><strong>模型:</strong> {{ selectedRow?.model || '默认模型' }}</p>
        </div>
        <p style="color: #ff4d4f;">注意：删除后无法恢复，请谨慎操作！</p>
      </div>
    </div>
    <div class="modal-footer">
      <div class="form-group">
        <div class="btnGroup modal-btn" style="margin-top: -16px;">
          <button type="button" class="plx-btn plx-btn-danger" (click)="delete_submit()">确定删除</button>
          <button type="button" class="plx-btn" (click)="delete_cancel()">取消</button>
        </div>
      </div>
    </div>
  </ng-template>
</div>
