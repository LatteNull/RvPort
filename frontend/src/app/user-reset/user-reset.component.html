<h2 mat-dialog-title>重置密码</h2>
<mat-dialog-content [formGroup]="form" class="dialog-body">

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>用户名</mat-label>
    <input matInput [value]="data.username" disabled>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>管理员密码</mat-label>
    <input matInput [type]="hideOld ? 'password' : 'text'" formControlName="oldPassword">
    <button mat-icon-button matSuffix (click)="hideOld = !hideOld" [attr.aria-label]="'切换密码可见性'">
      <i class="input-icon" 
      [ngClass]="{
        'plx-ico-eye-16': !hideOld,
        'plx-ico-eye-closed-16': hideOld
      }"></i>
    </button>
    <mat-error *ngIf="form.get('oldPassword')?.hasError('required')">请输入管理员密码</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>新密码</mat-label>
    <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="newPassword">
    <button mat-icon-button matSuffix (click)="hideNew = !hideNew" [attr.aria-label]="'切换密码可见性'">
      <i class="input-icon" 
      [ngClass]="{
        'plx-ico-eye-16': !hideNew,
        'plx-ico-eye-closed-16': hideNew
      }"></i>
      <!-- <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon> -->
    </button>
    <mat-error *ngIf="form.get('newPassword')?.hasError('required')">请输入新密码</mat-error>
    <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">密码长度至少8位</mat-error>
    <mat-error *ngIf="form.get('newPassword')?.hasError('maxLength')">密码长度至多64位</mat-error>
    <mat-error *ngIf="form.get('newPassword')?.hasError('pattern')">密码必须包含大小写字母、数字、特殊符号中至少三项</mat-error>

  </mat-form-field>

  <!-- 密码强度提示条 -->
  <div class="strength-bar" [ngClass]="passwordStrength">
    密码强度：{{ getStrengthLabel() }}
  </div>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>再次确认</mat-label>
    <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword">
    <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" [attr.aria-label]="'切换密码可见性'">
      <i class="input-icon" 
      [ngClass]="{
        'plx-ico-eye-16': !hideConfirm,
        'plx-ico-eye-closed-16': hideConfirm
      }"></i>
    </button>
    <mat-error *ngIf="form.get('confirmPassword')?.hasError('required') && form.get('confirmPassword')?.touched">
      请再次输入您的密码
    </mat-error>
  </mat-form-field>
  <div class="error" *ngIf=" !similar && form.get('confirmPassword')?.touched">
    两次输入密码不一致
  </div>

</mat-dialog-content>

<mat-dialog-actions>
  <button 
    class="confirm-btn" 
    (click)="onSubmit()" 
    [disabled]="form.invalid"  
    mat-flat-button            
  >
    确定
  </button>
  <button 
    class="cancel-btn" 
    (click)="onCancel()"
    mat-stroked-button        
  >
    关闭
  </button>
</mat-dialog-actions>
