<div class="main-container">
    <div class="task-cards-container">
      <div class="task-card">
        <div class="task-header">
          <div><strong>软件包：</strong>{{ dependence_name }}</div>
          <div><strong>版本号：</strong>{{ version }}</div>
        </div>
        <!-- <div class="task-report">
          <div>
            <strong>下载报告：</strong>
            <button
              type="button"
              class="plx-btn plx-btn-xs"
              (click)="exportExcel()"
            >
              导出
            </button>
          </div>
        </div> -->
      </div>
      <div class="summary-card">
        <div class="section-title">问题统计摘要</div>
        <table class="summary-table">
          <thead>
            <tr>
              <th>建议类型</th>
              <th>问题数量</th>
              <th>影响行数</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of summary_data">
              <td>{{ item.type }}</td>
              <td>{{ item.issues }}</td>
              <td>{{ item.affectedLines == null ? "" : item.affectedLines }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="table-scroll-wrapper">
      <plx-tabset [type]="'pills'" (tabChange)="tabChange($event)">
        <ng-container *ngFor="let item of tabItems">
          <plx-tab [id]="item.activeId" [title]="item.title" [blue]="true">
            
            <ng-template
              *ngIf="item.activeId == '缺失文件信息'; else otherContent"
              pxTabContent
            >
              <plx-table
                #plxTable
                [data]="item.data"
                [columns]="item.columns"
                [showCheckBox]="false"
                [showColFilterToggle]="false"
                [showCustomCol]="false"
                [isTreeTable]="true"
                [childDisplayMax]="1000"
                (onRowExpandCollapse)="onRowExpandCollapse($event)"
                [showGlobalFilter]="false"
                [loadingPlaceholder]="'加载中...'"
                [showLoading]="showLoading"
                [showPagination]="true"
                [showNoDataMessage]="true"
                [pageSize]="13"
              >
              </plx-table>
            </ng-template>
            <ng-template #otherContent pxTabContent>
              <plx-table
                [data]="item.data"
                [columns]="item.columns"
                [showCheckBox]="false"
                [showColFilterToggle]="false"
                [showCustomCol]="false"
                [showGlobalFilter]="false"
                [showPagination]="true"
                [showNoDataMessage]="true"
                [pageSize]="13"
              >
              </plx-table>
            </ng-template>
          </plx-tab>
          
        </ng-container>
      </plx-tabset>
    </div>
  </div>
