<div class="proxy-config-container">
    <h2>网络代理配置</h2>
        
    <form [formGroup]="proxyForm" (ngSubmit)="onSubmit()">
        <!-- HTTP Proxy -->
        <div class="config-row">
            <label class="config-label" for="httpProxy">Docker HTTP 代理</label>
            <div class="config-input">
                <input
                    type="text"
                    id="httpProxy"
                    formControlName="httpProxy"
                    class="form-control"
                    placeholder="设置HTTP代理服务器地址，格式：http://host:port"
                >
                <div *ngIf="hasError('httpProxy')" class="error-message">
                    {{ getErrorMessage('httpProxy') }}
                </div>
            </div>
        </div>

        <!-- HTTPS Proxy -->
        <div class="config-row">
            <label class="config-label" for="httpsProxy">Docker HTTPS 代理</label>
            <div class="config-input">
                <input
                    type="text"
                    id="httpsProxy"
                    formControlName="httpsProxy"
                    class="form-control"
                    placeholder="设置HTTPS代理服务器地址，格式：https://host:port"
                >
                <div *ngIf="hasError('httpsProxy')" class="error-message">
                    {{ getErrorMessage('httpsProxy') }}
                </div>
            </div>
        </div>

        <!-- No Proxy -->
        <div class="config-row">
            <label class="config-label" for="noProxy">Docker 无需代理的主机</label>
            <div class="config-input">
                <textarea
                    id="noProxy"
                    formControlName="noProxy"
                    class="form-control"
                    placeholder="localhost,127.0.0.1,.example.com"
                ></textarea>
            <div *ngIf="hasError('noProxy')" class="error-message">
                {{ getErrorMessage('noProxy') }}
            </div>
                <div class="help-text">
                    设置不需要通过代理访问的主机列表，用逗号分隔
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                保存配置
            </button>
        </div>
    </form>
</div>
