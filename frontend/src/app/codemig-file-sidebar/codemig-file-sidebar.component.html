<app-top-menu [title]="'RISC-V 迁移工具'" [tool]="'codemig'"></app-top-menu>
<div class="main-container">
  <div class="plx-menu-basic-border-color" style="width: 100%; position: absolute; top: 50px; bottom: 0px; display: flex;">
    <div class="tree-container" style="height: 100%; padding: 15px;">
        <plx-drag-handle
            [right]="true"
            [initWidth]="'300px'"
        >
        <div class="tree-navigation">
          <div class="nav-buttons">
            <button 
              [disabled]="!canNavigatePrevious()"
              (click)="navigateToPrevious()"
              [plxTooltip]="'上一个'">
              <span class="plx-ico-up-16"></span>
            </button>
            <button 
              [disabled]="!canNavigateNext()"
              (click)="navigateToNext()"
              [plxTooltip]="'下一个'">
              <span class="plx-ico-down-16"></span>
            </button>
            <button 
              [disabled]="!canCreateFile()"
              (click)="createNewFile()"
              [plxTooltip]="'新建文件'">
              <span class="plx-ico-file-16"></span>
            </button>
            <button 
              [disabled]="!canCreateDirectory()"
              (click)="createNewDirectory()"
              [plxTooltip]="'新建目录'">
              <span class="plx-ico-folder-16"></span>
            </button>
            <button 
              [disabled]="!canDelete()"
              (click)="deleteCurrentNode()"
              [plxTooltip]="'删除'">
              <span class="plx-ico-delete-16"></span>
            </button>
            <button 
              (click)="collapseAll()"
              [plxTooltip]="'全部折叠'">
              <span class="plx-ico-minus-all-16"></span>
            </button>
          </div>
        </div>
        <plx-tree #tree
          [value]="treeNodes"
          [searchOptions]="searchOptions"
          (onNodeClick)="click($event)"
          [isHeightLight]="true">
        </plx-tree>
      </plx-drag-handle>
    </div>
    <div class="drag-right editor-container">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
