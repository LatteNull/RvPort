<div style="overflow: hidden;">
    <app-top-menu [title]="'RISC-V 迁移工具'" [is_goback]="false" [tool]="'platform'" ></app-top-menu>
    <div class="plx-card-container">
        <a class="plx-card-wrapper" (click)="clickM()">
            <plx-card [card]="card" [isSimple]="true" [width]="'100%'">
                <div class="plx-card-titleshow plx-card-demo-title">{{ '迁移工具' }}</div>
                <div class="plx-card-contentshow">
                    <div class="plx-card-content-item">
                        <span *ngIf="myTypeMap.get('codemig') == 'OK'" class="plx-ico-fm-restype-16 plx-card-content-grid"></span>
                        <span *ngIf="myTypeMap.get('codemig') != 'OK'" class="plx-ico-fm-restype-16 plx-card-content-grid-gray"></span>
                        <div class="plx-demo-text">
                            {{ '迁移工具' }}{{ myTypeMap.get('codemig') != 'OK' ? ' (未安装)' : '' }}
                        </div>
                    </div>
                </div>
            </plx-card>
        </a>
    </div>
    <div class="copyright-footer">
        <span>&copy; 2026 中兴通讯股份有限公司 版权所有</span>
        <span class="footer-separator">|</span>
        <a class="license-link" (click)="openSourceLicense()">开源许可协议</a>
    </div>
</div>
