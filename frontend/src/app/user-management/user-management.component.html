<ng-template #rowTemplate let-data="data">
    <div>
      <span class="detail-status">{{data.role == 'admin' ? '管理员' : '普通用户'}}</span>
    </div>
</ng-template>

<div style="height: calc(100vh - 90px); overflow: auto;">
    <div>
        <button class="batch-delete-btn"
                class="plx-btn plx-btn-primary"
                (click)="create_user()">
          新建
        </button>
        <br>
    </div>
    <!-- 新建用户 -->
    <ng-template #create_content let-c="close" let-d="dismiss" let-row="data">
        <div class="modal-header">
            <h4 class="modal-title">新建用户</h4>
            <button type="button" class="close" (click)="d('Cross click')">
                <span class="plx-ico-close-16"></span>
            </button>
        </div>
        <div class="modal-body">
            <plx-form [settings]="create_formSetting"></plx-form>
        </div>
        <div class="modal-footer">
            <div class="form-group">
                <div class="btnGroup modal-btn"  style="margin-top: -16px;">
                    <button type="button" class="plx-btn plx-btn-primary" (click)="create_submit()">确定</button>
                    <button type="button" class="plx-btn" (click)="create_cancel()">取消</button>
                </div>
            </div>
        </div>
    </ng-template>
    <div class="table-scroll-wrapper">
        <plx-table [data]="data"
                [columns]="columns"
                [pageSize]="50"
                [tableType]="'large'"
                [showColFilterToggle]="false"
                [showCustomCol]="false"
                [isPrepareDataOnLocal]="true"
                [showGlobalFilter]="false"
                [showPagination]="true"
                [pageSize]="15"
                [scroll]="{ x: '100%', y: calcTableHeight(), keepHeight: false }"
                >
        </plx-table>
    </div>
    <!-- button -->
    <ng-template #operationTemplate let-row="data">
        <!-- <button *ngIf="row.status === 'Pending'"  class="plx-btn plx-btn-sm plx-btn-table"  (click)="modify(content1,row)">重置密码</button> -->
        <button *ngIf="row.user_name == CurrentUser" class="plx-btn plx-btn-sm plx-btn-table" (click)="modify(row)">修改密码</button>
        <button *ngIf="row.user_name != CurrentUser" class="plx-btn plx-btn-sm plx-btn-table" (click)="resetpassword(row)">重置密码</button>
        <button *ngIf="row.user_name != CurrentUser" class="plx-btn plx-btn-sm plx-btn-table" (click)="deleteuser(row)">删除</button>
    </ng-template>
    
    
    <!-- 删除用户 -->
    <ng-template #delete_content let-c="close" let-d="dismiss" let-row="data">
        <div class="modal-header">
            <h4 class="modal-title">删除用户</h4>
            <button type="button" class="close" (click)="d('Cross click')">
                <span class="plx-ico-close-16"></span>
            </button>
        </div>
        <div class="modal-body">
            <h4 class="modal-title">用户名: {{rowData.user_name}}</h4>
            <plx-form #deleteform [settings]="delete_formSetting"></plx-form>
        </div>
        <div class="modal-footer">
            <div class="form-group">
                <div class="btnGroup modal-btn"  style="margin-top: -16px;">
                    <button type="button" class="plx-btn plx-btn-primary" (click)="delete_submit()">确定</button>
                    <button type="button" class="plx-btn" (click)="delete_cancel()">取消</button>
                </div>
            </div>
        </div>
    </ng-template>
</div>
