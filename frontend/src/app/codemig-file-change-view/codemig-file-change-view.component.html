<div class="editor-wrapper">
  <div class="editor-toolbar">
    <button class="plx-btn plx-btn-primary" (click)="goBack()">返回</button>
    <button class="plx-btn plx-btn-primary" (click)="saveChanges()">保存修改</button>
    <button class="plx-btn plx-btn-primary" (click)="saveAndRollback()">回退</button>

    <div style="width: 400px; margin-right: 10px;">
      <plx-select #mySelect
        class="suggestion-select"
        [placeholder]="suggestionSelectPlaceholder"
        [isShowDeleteBtn]=true
        (deselected)="onDeselected()"
        (selected)="onSelected()"
        [options]="suggestionOptions"
        [(ngModel)]="selectedSuggestionOption">
        <ng-template #optionTemplate  let-option="option">
          <div class="custom-option-wrapper"
               [style.fontWeight]="isPlaceholderOption(option) ? '700' : '400'"
               [style.color]="isPlaceholderOption(option) ? '#333' : '#4D4D4D'"
               style="display: flex; justify-content: space-between; align-items: center;">
            <span class="option-label" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              {{ option.label }}
            </span>

            <i *ngIf="!dependence_id && !isPlaceholderOption(option)"
              class="plx-ico-close-16"
              style="margin-left: 8px; cursor: pointer; color: #999;"
              (click)="removeOption($event, option)">
            </i>
          </div>
        </ng-template>
      </plx-select>
    </div>
    <button class="plx-btn plx-btn-primary" (click)="check()">
      AI生成
    </button>
    <button class="plx-btn plx-btn-primary" (click)="cancelRequest()">
      停止生成
    </button>
    <button class="plx-btn plx-btn-primary" (click)="toggleAIPanel()">
      {{ showAIPanel ? '隐藏AI面板' : '显示AI面板' }}
    </button>
    <plx-select
      class="plx-select"
      placeholder="请选择AI模式"
      [(ngModel)]="aiMode"
      [options]="[
        {label: '建议模式', value: 'reasoning'},
        {label: 'Agent模式', value: 'agent'}
      ]"
      (ngModelChange)="onAiModeChange($event)">
    </plx-select>
    <span class="model-label">模型：</span>
    <plx-select
      class="plx-select"
      [placeholder]="modelSelectPlaceholder"
      [(ngModel)]="selectedModel"
      [options]="modelOptions"
      (ngModelChange)="onModelChange($event)"
      [disabled]="aiMode === 'normal'">
    </plx-select>
    <button class="plx-btn plx-btn-primary" (click)="goToApiKeyManagement()">管理 API Key</button>
  </div>

  <div class="editor-container">
    <!-- 左侧编辑器 -->
    <div class="editor-box" [style.flex]="leftPanelFlex" [ngClass]="{'editor-full-width': !showAIPanel}">
      <ngx-monaco-diff-editor
      style="height: 100%;"
      [options]="editorOptions"
      [originalModel]="originalModel"
      [modifiedModel]="modifiedModel"
      (onInit)="onEditorInit($event)">
      </ngx-monaco-diff-editor>
    </div>
    <!-- 拖拽分割线 -->
    <div *ngIf="showAIPanel" class="resize-handle" (mousedown)="startResize($event)"></div>
    <!-- 右侧AI建议面板 - 简化版 -->
    <div class="ai-suggestions-panel" [style.flex]="rightPanelFlex" *ngIf="showAIPanel">
      <div class="panel-header">
        <h3 style="font-size: 16px;">AI 建议</h3>
        <button class="plx-ico-close-16 plx-card-close" (click)="toggleAIPanel()"></button>
      </div>
      <div #panelContent (scroll)="onPanelScroll()" *ngIf="suggestion; else elseBlock" class="panel-content">
        <div #suggestionMarkdown class="suggestion-content" markdown [data]="suggestion" (ready)="onSuggestionRenderReady()"></div>
        <div *ngIf="isGenerating" class="ai-loading-container">
          <div class="loading-spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
       </div>
        <button *ngIf="suggestion" class="plx-ico-copy-16" [plxTooltip]="'复制'" (click)="copyContent()"
        style="border: none; background: white; font-size: 16px; height: 25px; line-height: 25px;"></button>
        <button *ngIf="suggestion" class="plx-ico-clear-16" [plxTooltip]="'清除建议'" (click)="clearContent()"
        style="border: none; background: white; font-size: 16px; height: 25px;  line-height: 25px"></button>
        <button *ngIf="suggestion" type="button" class="plx-ico-like-16 score-btn"
        [class.score-btn-liked]="isLiked" [plxTooltip]="isLiked ? '取消点赞' : '点赞'" (click)="likeContent()"
        style="border: none; background: white; font-size: 16px; height: 25px;  line-height: 25px"></button>
        <button *ngIf="suggestion" type="button" class="plx-ico-dislike-16 score-btn"
        [class.score-btn-disliked]="isDisliked" [plxTooltip]="isDisliked ? '取消点踩' : '点踩'" (click)="dislikeContent()"
        style="border: none; background: white; font-size: 16px; height: 25px;  line-height: 25px"></button>
      </div>
      <ng-template #elseBlock>
        <div *ngIf="isGenerating" class="ai-loading-container" style="min-height: 23vh;">
          <div class="loading-spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
       </div>
        <div *ngIf="!isGenerating" class="panel-content">
          <div class="plx-card-contentshow" style="text-align:center; margin-top: 6vh;" plx-empty [iconName]="'empty-display'"></div>
        </div>
      </ng-template>
    </div>
  </div>
</div>

<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
      <h4 class="modal-title">删除</h4>
      <button type="button" class="close" (click)="d('Cross click')">
          <span class="plx-ico-close-16"></span>
      </button>
  </div>
  <div class="modal-body" style="min-height: 54px;">
      <div class="row alert-modal" style="min-height: 54px;">
          <span class="tip-icon error plx-ico-dialog-risk-48"></span>
          <div class="tip-info">
              <div class="alert-title">确定删除第{{ deleteSuggestionOption.value[0] }}行该建议信息吗？</div>
              <div class="alert-result">建议信息删除后将不能恢复。</div>
          </div>
      </div>
  </div>
  <div class="modal-footer">
      <div class="form-group">
          <div class="btnGroup modal-btn">
              <button type="button" class="plx-btn plx-btn-error" (click)="deleteSuggestion()">删除</button>
              <button type="button" class="plx-btn" (click)="c('Close click')">取消</button>
          </div>
      </div>
  </div>
</ng-template>
