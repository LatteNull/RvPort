<app-top-menu [title]="'RISC-V 迁移工具'"></app-top-menu>
<div class="main-container">
    <div class="plx-menu-basic-border-color" style="display: flex; width: 100%;height: calc(100vh - 50px);font-size: 0;border-width: 1px;">
        <div style="display: inline-block;height: 100%;">
            <div style="height: 100%;width: 200px;">
                <div plx-menu
                [menuConfig]="menuConfig"
                [isAutoRouter]="false"
                (plxClick)="menuClick($event)" (collapseBtnClick)="collapseBtnClick($event)">
                </div>
            </div>
        </div>
        <div class="drag-right editor-container">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
