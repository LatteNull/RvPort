name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要部署的镜像 tag（须已通过 build-and-push 推送，例如 v1.0.0）'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Dev (self-hosted)
    runs-on: self-hosted
    environment: dev
    env:
      DEPLOY_ENV: dev
      DEPLOY_BASE: /opt/ryport/deploy
      DEPLOY_DIR: /opt/ryport/deploy/ryport-dev
      PROJECT: ryport-dev
      BACKEND_IMAGE: ghcr.io/rvport/rvport-backend
      FRONTEND_IMAGE: ghcr.io/rvport/rvport-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Confirm target
        run: |
          echo "部署目标: dev (端口 8080/8081)"
          echo "镜像 tag: ${{ github.event.inputs.tag }}"
          echo "部署目录: ${DEPLOY_DIR}（仅覆盖更新，不删除目录内已有内容）"

      - name: Pre-check target directory
        run: |
          if [ ! -d "${DEPLOY_DIR}" ]; then
            echo "::error:: 部署目录不存在: ${DEPLOY_DIR}"
            exit 1
          fi
          echo "[OK] 部署目录存在"

      - name: Pre-check ports
        run: |
          PORTS='8080 8081 5432 6379 5672 15672 9000 9001'
          for port in ${PORTS}; do
            if docker ps --format '{{.Ports}}' | grep -q ":${port}->"; then
              echo "::error:: 端口 ${port} 已被占用"
              exit 1
            fi
          done
          echo '端口检查通过'

      - name: Copy compose and init files (overwrite only)
        run: |
          cp docker-compose.yml "${DEPLOY_DIR}/docker-compose.yml"
          mkdir -p "${DEPLOY_DIR}/backend/infra/postgres"
          cp -r backend/infra/postgres/init "${DEPLOY_DIR}/backend/infra/postgres/"
          echo "[OK] compose 与 postgres init 已更新"

      - name: Write .env (from repository env file + image tag)
        run: |
          cp .github/env/dev.env "${DEPLOY_DIR}/.env"
          printf '\nBACKEND_IMAGE=%s:%s\n' "${BACKEND_IMAGE}" "${{ github.event.inputs.tag }}" >> "${DEPLOY_DIR}/.env"
          printf 'FRONTEND_IMAGE=%s:%s\n' "${FRONTEND_IMAGE}" "${{ github.event.inputs.tag }}" >> "${DEPLOY_DIR}/.env"
          echo "[OK] .env 已写入（追加 GHCR 镜像 tag）"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images (verify tag exists)
        run: |
          docker pull "${BACKEND_IMAGE}:${{ github.event.inputs.tag }}" || { echo '::error:: 后端镜像 tag 不存在，请先打 tag 并完成 build-and-push'; exit 1; }
          docker pull "${FRONTEND_IMAGE}:${{ github.event.inputs.tag }}" || { echo '::error:: 前端镜像 tag 不存在，请先打 tag 并完成 build-and-push'; exit 1; }
          echo '[OK] 镜像拉取成功'

      - name: Pre-check disk
        run: df -h /

      - name: Compose up (non-destructive, no-build)
        run: |
          cd "${DEPLOY_DIR}"
          docker compose -f docker-compose.yml --project-name "${PROJECT}" \
            up -d --wait --wait-timeout 120 --no-build
          docker compose -f docker-compose.yml --project-name "${PROJECT}" ps

      - name: Health check backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo '[OK] 后端健康检查通过'
              exit 0
            fi
            sleep 5
          done
          echo '::error:: 后端健康检查超时'
          exit 1

      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  dev 部署完成"
          echo "  镜像 tag: ${{ github.event.inputs.tag }}"
          echo "  API:  http://10.20.101.1:8080"
          echo "  前端: http://10.20.101.1:8081"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
