name: Build and Push Images

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/RvPort/rvport-backend
      FRONTEND_IMAGE: ghcr.io/RvPort/rvport-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image tags
        id: tags
        run: |
          TAG="${{ github.ref_name }}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "镜像 Tag: ${TAG}（同时更新 latest）"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 后端镜像 ----------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 前端镜像 ----------
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
          echo '  镜像构建 & 推送完成!'
          echo "  Tag: ${{ steps.tags.outputs.TAG }}"
          echo "  后端: ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.TAG }} (latest)"
          echo "  前端: ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.TAG }} (latest)"
          echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
