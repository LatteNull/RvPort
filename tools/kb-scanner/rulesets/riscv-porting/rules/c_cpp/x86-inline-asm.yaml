        regex: "\\b(__asm__|__asm|asm)\\b.*\\b(xmm|ymm|zmm|eax|ebx|ecx|edx|rax|rbx|rcx|rdx|cpuid|rdtsc|rdtscp|xgetbv|mfence|lfence|sfence|pause)\\b"
message:
  zh-CN:
    title: "使用 x86 inline assembly"
    reason: "代码中出现 x86 寄存器或指令相关 inline assembly，RISC-V 环境无法直接使用。"
