name: ${COMPOSE_PROJECT_NAME:-rvport}

services:
  frontend:
    image: ${FRONTEND_IMAGE:-rvport-frontend:local}
    build:
      context: ./frontend
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - rvport-infra

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rvport}
      POSTGRES_USER: ${POSTGRES_USER:-rvport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rvport-postgres-data:/var/lib/postgresql
      - ./backend/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rvport-infra

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.2-management}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rvport}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-rvport}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rvport-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rvport-infra

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.0}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - rvport-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rvport-infra

  minio:
    image: ${MINIO_IMAGE:-rvport-minio:local}
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rvport}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rvport-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rvport-infra

  backend:
    image: ${BACKEND_IMAGE:-rvport-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22.23.2}
        NODE_DISTRO: ${NODE_DISTRO:-linux-x64}
        NODEJS_MIRROR: ${NODEJS_MIRROR:-https://npmmirror.com/mirrors/node}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.147.0}
        DEEPSEEK_HARNESS_VERSION: ${DEEPSEEK_HARNESS_VERSION:-0.1.0-rc.7}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.18}
        LLVM_PACKAGE_VERSION: ${LLVM_PACKAGE_VERSION:-1:18.1.3-1ubuntu1}
        RVPORT_AGENT_CODEX_EXECUTABLE: ${RVPORT_AGENT_CODEX_EXECUTABLE:-codex}
        RVPORT_AGENT_DEEPSEEK_HARNESS_EXECUTABLE: ${RVPORT_AGENT_DEEPSEEK_HARNESS_EXECUTABLE:-dsh}
        RVPORT_AGENT_OPENCODE_EXECUTABLE: ${RVPORT_AGENT_OPENCODE_EXECUTABLE:-opencode}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      RVPORT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rvport}
      RVPORT_DB_USER: ${POSTGRES_USER:-rvport}
      RVPORT_DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      RVPORT_REDIS_HOST: redis
      RVPORT_REDIS_PORT: 6379
      RVPORT_REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
      RVPORT_RABBITMQ_HOST: rabbitmq
      RVPORT_RABBITMQ_PORT: 5672
      RVPORT_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rvport}
      RVPORT_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change_me}
      RVPORT_RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-rvport}
      RVPORT_OBJECT_STORAGE_ENABLED: ${RVPORT_OBJECT_STORAGE_ENABLED:-true}
      RVPORT_OBJECT_STORAGE_ENDPOINT: ${RVPORT_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      RVPORT_OBJECT_STORAGE_REGION: ${RVPORT_OBJECT_STORAGE_REGION:-us-east-1}
      RVPORT_OBJECT_STORAGE_BUCKET: ${RVPORT_OBJECT_STORAGE_BUCKET:-rvport-artifacts}
      RVPORT_OBJECT_STORAGE_ACCESS_KEY: ${RVPORT_OBJECT_STORAGE_ACCESS_KEY:-rvport}
      RVPORT_OBJECT_STORAGE_SECRET_KEY: ${RVPORT_OBJECT_STORAGE_SECRET_KEY:-change_me_minio}
      RVPORT_OBJECT_STORAGE_PATH_STYLE: ${RVPORT_OBJECT_STORAGE_PATH_STYLE:-true}
      RVPORT_OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${RVPORT_OBJECT_STORAGE_AUTO_CREATE_BUCKET:-true}
      RVPORT_CREDENTIAL_MASTER_KEY: ${RVPORT_CREDENTIAL_MASTER_KEY}
      RVPORT_CREDENTIAL_KEY_ID: ${RVPORT_CREDENTIAL_KEY_ID:-local-v1}
      RVPORT_MAX_FILE_SIZE: ${RVPORT_MAX_FILE_SIZE:-10GB}
      RVPORT_MAX_REQUEST_SIZE: ${RVPORT_MAX_REQUEST_SIZE:-10GB}
      RVPORT_LOG_DIR: /app/backend/runtime/logs
      RVPORT_ARCHIVE_DIR: /app/backend/runtime/archives
      RVPORT_UPLOAD_DIR: /app/backend/runtime/uploads
      RVPORT_SOURCE_DIR: /app/backend/runtime/sources
      RVPORT_KB_SCAN_PYTHON_COMMAND: ${RVPORT_KB_SCAN_PYTHON_COMMAND:-/opt/kb-scanner-venv/bin/python}
      RVPORT_KB_SCAN_SCANNER_ROOT: /app/tools/kb-scanner
      RVPORT_KB_SCAN_RULESET_PATH: rulesets/riscv-porting
      RVPORT_KB_SCAN_OUTPUT_DIR: /app/backend/runtime/kb-scans
      RVPORT_KB_SCAN_TIMEOUT_SECONDS: ${RVPORT_KB_SCAN_TIMEOUT_SECONDS:-1800}
      RVPORT_KB_SCAN_MAX_OUTPUT_BYTES: ${RVPORT_KB_SCAN_MAX_OUTPUT_BYTES:-104857600}
      RVPORT_SPECIALIZED_ANALYSIS_ENABLED: ${RVPORT_SPECIALIZED_ANALYSIS_ENABLED:-true}
      RVPORT_SPECIALIZED_ANALYSIS_WORK_DIR: /app/backend/runtime/specialized-analysis
      RVPORT_SPECIALIZED_ANALYSIS_TIMEOUT_SECONDS: ${RVPORT_SPECIALIZED_ANALYSIS_TIMEOUT_SECONDS:-3600}
      RVPORT_SPECIALIZED_ANALYSIS_MAX_OUTPUT_BYTES: ${RVPORT_SPECIALIZED_ANALYSIS_MAX_OUTPUT_BYTES:-268435456}
      RVPORT_SPECIALIZED_ANALYSIS_MAX_EXTRACTED_BYTES: ${RVPORT_SPECIALIZED_ANALYSIS_MAX_EXTRACTED_BYTES:-1073741824}
      RVPORT_SPECIALIZED_ANALYSIS_MAX_FILES: ${RVPORT_SPECIALIZED_ANALYSIS_MAX_FILES:-200000}
      RVPORT_FLOATING_POINT_PYTHON: /opt/specialized-analysis-venv/bin/python
      RVPORT_FLOATING_POINT_SCANNER: /opt/specialized-analysis-venv/bin/fp-precision-scanner
      RVPORT_FLOATING_POINT_CLANG: /usr/bin/clang-21
      RVPORT_FLOATING_POINT_IR_WORKER: /opt/rvport/analysis-tools/bin/fp-ir-worker
      RVPORT_MEMORY_ORDER_PYTHON: /opt/specialized-analysis-venv/bin/python
      RVPORT_MEMORY_ORDER_IR_WORKER: /opt/rvport/analysis-tools/bin/moa-worker
      RVPORT_MEMORY_ORDER_SOURCE_WORKER: /opt/rvport/analysis-tools/bin/memory-order-source-worker
      RVPORT_AGENT_CODEX_EXECUTABLE: ${RVPORT_AGENT_CODEX_EXECUTABLE:-codex}
      RVPORT_AGENT_DEEPSEEK_HARNESS_EXECUTABLE: ${RVPORT_AGENT_DEEPSEEK_HARNESS_EXECUTABLE:-dsh}
      RVPORT_AGENT_OPENCODE_EXECUTABLE: ${RVPORT_AGENT_OPENCODE_EXECUTABLE:-opencode}
      RVPORT_APP_MODE: api
      RVPORT_WORKER_ENABLED: "false"
      RVPORT_WORKER_CLEANUP_ENABLED: ${RVPORT_WORKER_CLEANUP_ENABLED:-true}
      RVPORT_WORKER_CLEANUP_INTERVAL_MS: ${RVPORT_WORKER_CLEANUP_INTERVAL_MS:-300000}
      RVPORT_WORKER_CLEANUP_LOST_TIMEOUT_SECONDS: ${RVPORT_WORKER_CLEANUP_LOST_TIMEOUT_SECONDS:-300}
      RVPORT_WORKER_CLEANUP_RETENTION_HOURS: ${RVPORT_WORKER_CLEANUP_RETENTION_HOURS:-24}
      RVPORT_WORKER_CLEANUP_BATCH_SIZE: ${RVPORT_WORKER_CLEANUP_BATCH_SIZE:-100}
      RVPORT_LIQUIBASE_ENABLED: "true"
    ports:
      - "${RVPORT_BACKEND_PORT:-8080}:8080"
    volumes:
      - rvport-backend-runtime:/app/backend/runtime
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/actuator/health', timeout=5).read()\""]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    networks:
      - rvport-infra

  backend-worker:
    image: ${BACKEND_IMAGE:-rvport-backend:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      RVPORT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rvport}
      RVPORT_DB_USER: ${POSTGRES_USER:-rvport}
      RVPORT_DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      RVPORT_REDIS_HOST: redis
      RVPORT_REDIS_PORT: 6379
      RVPORT_REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
      RVPORT_RABBITMQ_HOST: rabbitmq
      RVPORT_RABBITMQ_PORT: 5672
      RVPORT_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rvport}
      RVPORT_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change_me}
      RVPORT_RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-rvport}
      RVPORT_OBJECT_STORAGE_ENABLED: ${RVPORT_OBJECT_STORAGE_ENABLED:-true}
      RVPORT_OBJECT_STORAGE_ENDPOINT: ${RVPORT_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      RVPORT_OBJECT_STORAGE_REGION: ${RVPORT_OBJECT_STORAGE_REGION:-us-east-1}
      RVPORT_OBJECT_STORAGE_BUCKET: ${RVPORT_OBJECT_STORAGE_BUCKET:-rvport-artifacts}
      RVPORT_OBJECT_STORAGE_ACCESS_KEY: ${RVPORT_OBJECT_STORAGE_ACCESS_KEY:-rvport}
      RVPORT_OBJECT_STORAGE_SECRET_KEY: ${RVPORT_OBJECT_STORAGE_SECRET_KEY:-change_me_minio}
      RVPORT_OBJECT_STORAGE_PATH_STYLE: ${RVPORT_OBJECT_STORAGE_PATH_STYLE:-true}
      RVPORT_OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${RVPORT_OBJECT_STORAGE_AUTO_CREATE_BUCKET:-true}
      RVPORT_CREDENTIAL_MASTER_KEY: ${RVPORT_CREDENTIAL_MASTER_KEY}
      RVPORT_CREDENTIAL_KEY_ID: ${RVPORT_CREDENTIAL_KEY_ID:-local-v1}
      RVPORT_MAX_FILE_SIZE: ${RVPORT_MAX_FILE_SIZE:-10GB}
      RVPORT_MAX_REQUEST_SIZE: ${RVPORT_MAX_REQUEST_SIZE:-10GB}
      RVPORT_LOG_DIR: /app/backend/runtime/logs
      RVPORT_ARCHIVE_DIR: /app/backend/runtime/archives
      RVPORT_UPLOAD_DIR: /app/backend/runtime/uploads
      RVPORT_SOURCE_DIR: /app/backend/runtime/sources
      RVPORT_KB_SCAN_PYTHON_COMMAND: ${RVPORT_KB_SCAN_PYTHON_COMMAND:-/opt/kb-scanner-venv/bin/python}
      RVPORT_KB_SCAN_SCANNER_ROOT: /app/tools/kb-scanner
      RVPORT_KB_SCAN_RULESET_PATH: rulesets/riscv-porting
      RVPORT_KB_SCAN_OUTPUT_DIR: /app/backend/runtime/kb-scans
      RVPORT_KB_SCAN_TIMEOUT_SECONDS: ${RVPORT_KB_SCAN_TIMEOUT_SECONDS:-1800}
      RVPORT_KB_SCAN_MAX_OUTPUT_BYTES: ${RVPORT_KB_SCAN_MAX_OUTPUT_BYTES:-104857600}
      RVPORT_SPECIALIZED_ANALYSIS_ENABLED: ${RVPORT_SPECIALIZED_ANALYSIS_ENABLED:-true}
      RVPORT_SPECIALIZED_ANALYSIS_WORK_DIR: /app/backend/runtime/specialized-analysis
      RVPORT_SPECIALIZED_ANALYSIS_TIMEOUT_SECONDS: ${RVPORT_SPECIALIZED_ANALYSIS_TIMEOUT_SECONDS:-3600}
      RVPORT_SPECIALIZED_ANALYSIS_MAX_OUTPUT_BYTES: ${RVPORT_SPECIALIZED_ANALYSIS_MAX_OUTPUT_BYTES:-268435456}
      RVPORT_SPECIALIZED_ANALYSIS_MAX_EXTRACTED_BYTES: ${RVPORT_SPECIALIZED_ANALYSIS_MAX_EXTRACTED_BYTES:-1073741824}
      RVPORT_SPECIALIZED_ANALYSIS_MAX_FILES: ${RVPORT_SPECIALIZED_ANALYSIS_MAX_FILES:-200000}
      RVPORT_FLOATING_POINT_PYTHON: /opt/specialized-analysis-venv/bin/python
      RVPORT_FLOATING_POINT_SCANNER: /opt/specialized-analysis-venv/bin/fp-precision-scanner
      RVPORT_FLOATING_POINT_CLANG: /usr/bin/clang-21
      RVPORT_FLOATING_POINT_IR_WORKER: /opt/rvport/analysis-tools/bin/fp-ir-worker
      RVPORT_MEMORY_ORDER_PYTHON: /opt/specialized-analysis-venv/bin/python
      RVPORT_MEMORY_ORDER_IR_WORKER: /opt/rvport/analysis-tools/bin/moa-worker
      RVPORT_MEMORY_ORDER_SOURCE_WORKER: /opt/rvport/analysis-tools/bin/memory-order-source-worker
      RVPORT_AGENT_CODEX_EXECUTABLE: ${RVPORT_AGENT_CODEX_EXECUTABLE:-codex}
      RVPORT_AGENT_DEEPSEEK_HARNESS_EXECUTABLE: ${RVPORT_AGENT_DEEPSEEK_HARNESS_EXECUTABLE:-dsh}
      RVPORT_AGENT_OPENCODE_EXECUTABLE: ${RVPORT_AGENT_OPENCODE_EXECUTABLE:-opencode}
      RVPORT_APP_MODE: worker
      RVPORT_WORKER_ENABLED: "true"
      RVPORT_WORKER_INSTANCE_ID: ${RVPORT_WORKER_INSTANCE_ID:-}
      RVPORT_WORKER_CONCURRENCY_LIMIT: ${RVPORT_WORKER_CONCURRENCY_LIMIT:-1}
      RVPORT_WORKER_MAX_CONCURRENCY_LIMIT: ${RVPORT_WORKER_MAX_CONCURRENCY_LIMIT:-8}
      RVPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${RVPORT_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      RVPORT_WORKER_OFFLINE_TIMEOUT_SECONDS: ${RVPORT_WORKER_OFFLINE_TIMEOUT_SECONDS:-60}
      RVPORT_WORKER_CLEANUP_ENABLED: ${RVPORT_WORKER_CLEANUP_ENABLED:-true}
      RVPORT_WORKER_CLEANUP_INTERVAL_MS: ${RVPORT_WORKER_CLEANUP_INTERVAL_MS:-300000}
      RVPORT_WORKER_CLEANUP_LOST_TIMEOUT_SECONDS: ${RVPORT_WORKER_CLEANUP_LOST_TIMEOUT_SECONDS:-300}
      RVPORT_WORKER_CLEANUP_RETENTION_HOURS: ${RVPORT_WORKER_CLEANUP_RETENTION_HOURS:-24}
      RVPORT_WORKER_CLEANUP_BATCH_SIZE: ${RVPORT_WORKER_CLEANUP_BATCH_SIZE:-100}
      RVPORT_LIQUIBASE_ENABLED: false
    volumes:
      - rvport-backend-runtime:/app/backend/runtime
    networks:
      - rvport-infra

networks:
  rvport-infra:
    # 声明为 external：已部署环境中的该网络由更早版本的 compose 文件创建，
    #   其 com.docker.compose.network 标签为历史键名，而标签创建后无法修改，
    #   若由 compose 托管会因标签不匹配而拒绝启动。改为 external 后 compose
    #   只负责连接，不校验、不创建、不删除，从而兼容已有网络。
    #   网络需预先存在：部署流程会按需创建；本地开发执行一次
    #   `docker network create rvport-infra` 即可。
    external: true
    name: ${COMPOSE_PROJECT_NAME:-rvport}-infra

# 卷的最终名称可通过环境变量覆盖。
# 默认值保持 `<项目名>_<卷键名>` 的历史语义，用于本地开发；
# 已部署环境在各自的 .env 中显式指定实际卷名，以便沿用迁移前已存在的卷，
# 避免改名后静默创建空卷、表现为数据"丢失"。
volumes:
  rvport-postgres-data:
    name: ${RVPORT_POSTGRES_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-rvport}_rvport-postgres-data}
  rvport-rabbitmq-data:
    name: ${RVPORT_RABBITMQ_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-rvport}_rvport-rabbitmq-data}
  rvport-redis-data:
    name: ${RVPORT_REDIS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-rvport}_rvport-redis-data}
  rvport-minio-data:
    name: ${RVPORT_MINIO_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-rvport}_rvport-minio-data}
  rvport-backend-runtime:
    name: ${RVPORT_BACKEND_RUNTIME_VOLUME:-${COMPOSE_PROJECT_NAME:-rvport}_rvport-backend-runtime}
